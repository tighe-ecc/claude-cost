[project]
name = "claude-cost"
version = "0.1.0"
description = "Convert Claude Code token usage into an environmental footprint (kWh, kg CO2e, liters of water)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tighe Costa", email = "tighe@eightcoast.com" }]
keywords = ["claude", "llm", "carbon", "water", "sustainability", "ai-impact"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "rich>=13.0",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/tighe-ecc/claude-cost"
Issues = "https://github.com/tighe-ecc/claude-cost/issues"

[project.scripts]
claude-cost = "claude_cost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_cost"]

[tool.hatch.build.targets.wheel.shared-data]
"skill/claude-cost" = "share/claude-cost/skill/claude-cost"
